name: Prettier Auto Format

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier
        run: npx prettier --write .

      - name: Commit and Push Formatting Changes
        # Plain git instead of a third-party action: the repo's Actions policy
        # only allows GitHub-owned actions, so third-party ones fail at startup.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-format with prettier"
            git push origin "HEAD:$HEAD_REF"
          fi
